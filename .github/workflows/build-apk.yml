name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set after actions/setup-java."
            exit 1
          fi

          java -version

          RAW_VERSION="$(java -version 2>&1 | sed -nE 's/.*version "([^"]+)".*/\1/p' | head -n 1)"
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Unable to detect the active Java version."
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            JAVA_MAJOR="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          else
            JAVA_MAJOR="$(printf '%s' "$RAW_VERSION" | cut -d. -f1 | cut -d- -f1 | cut -d+ -f1)"
          fi

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse numeric Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR (raw: $RAW_VERSION)"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug keystore already exists at ./debug.keystore."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found or not executable at $KEYTOOL_BIN."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null

            if [ ! -f "./debug.keystore" ]; then
              echo "::error::Failed to create temporary ./debug.keystore."
              exit 1
            fi
            echo "Created temporary debug keystore for build."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK does not exist at $APK_PATH."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::$APK_PATH exists but is not a regular file."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty."
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::$APK_PATH does not have the .apk extension."
            exit 1
          fi

          APK_BYTES="$(wc -c < "$APK_PATH")"
          echo "Verified debug APK: $APK_PATH ($APK_BYTES bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          REPO_NAME_RAW="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO_NAME="$(printf '%s' "$REPO_NAME_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[.-]+|[.-]+$//g')"
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release.XXXXXX")"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed for $ASSET_PATH."
            exit 1
          fi

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_filename=${ASSET_FILENAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
        shell: bash
        run: |
          set -euo pipefail

          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing, empty, or not an .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE="$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes.XXXXXX.md")"
          {
            printf '%s\n' "This is an automatically generated debug APK built by GitHub Actions."
            printf '\n'
            printf '%s\n' "- **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}"
            printf '%s\n' "- **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}"
            printf '%s\n' "- **Source Commit SHA:** ${GITHUB_SHA}"
            printf '%s\n' "- **Asset Filename:** ${ASSET_FILENAME}"
            printf '\n'
            printf '%s\n' "**Important Notes:**"
            printf '%s\n' "- This APK is intended for testing and direct installation on Android devices."
            printf '%s\n' "- This APK is **not** a Google Play Store production release."
            printf '%s\n' "- This APK is signed only with a temporary debug keystore generated during the workflow run."
          } > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && steps.upload_artifact.outcome == 'success' && steps.prepare_asset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_FILENAME: ${{ steps.prepare_asset.outputs.asset_filename }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              CONFIRMED_TAG="$(gh release view "$RELEASE_TAG" --json tagName --jq '.tagName')"
              CONFIRMED_TITLE="$(gh release view "$RELEASE_TAG" --json name --jq '.name')"
              RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
              HAS_ASSET="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET_FILENAME" || true)"

              if [ -n "$RELEASE_URL" ] && [ -n "$HAS_ASSET" ]; then
                echo "Release verified via gh release view:"
                echo "  Release Tag: ${CONFIRMED_TAG}"
                echo "  Release Title: ${CONFIRMED_TITLE}"
                echo "  Release URL: ${RELEASE_URL}"
                echo "  APK Asset Filename: ${ASSET_FILENAME}"

                {
                  echo "## Debug APK Build & GitHub Release Succeeded"
                  echo ""
                  echo "- **Release Tag:** \`${CONFIRMED_TAG}\`"
                  echo "- **Release Title:** ${CONFIRMED_TITLE}"
                  echo "- **APK Asset Filename:** \`${ASSET_FILENAME}\`"
                  echo "- **GitHub Release Page:** ${RELEASE_URL}"
                  echo ""
                  echo "You can download \`${ASSET_FILENAME}\` directly from the **Assets** section on the GitHub Release page."
                  echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi

            echo "::warning::Release publishing step returned success, but release verification via gh release view could not confirm the release URL or asset."
            echo "APK build succeeded and Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build Succeeded (Release Verification Warning)"
              echo ""
              echo "> **Warning:** The APK build and artifact upload succeeded, but GitHub Release verification via \`gh release view\` could not confirm the published release asset."
              echo ""
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available for download from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag '${RELEASE_TAG}'. The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build Succeeded (GitHub Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- **APK Build Status:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` was uploaded before the release attempt and remains available on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
